name: Web app tests
# Each run says what it is in the Actions list: the nightly and manual runs
# test every engine on every operating system, a push or pull request Linux
# (every engine) plus WebKit on macOS.
run-name: >-
  ${{ github.event_name == 'schedule' && 'Nightly: every engine on Linux, macOS and Windows'
  || github.event_name == 'workflow_dispatch' && 'Manual full matrix: every engine on Linux, macOS and Windows'
  || github.event_name == 'pull_request' && format('Pull request: {0}', github.event.pull_request.title)
  || format('Push: {0}', github.event.head_commit.message) }}

on:
  push:
    branches: ["main"]
  pull_request:
  # Every engine on every operating system, once a day and on demand.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24", "26"]
    # The repository is checked out beside the sibling repositories its
    # cross-repository contracts read: `../cellucid-datasets` (the published
    # session presets), `../cellucid-python` and `../cellucid-r` (the
    # notebook widget's front end both packages ship, driven by
    # `tests/notebook-widget-requests-contract.test.mjs`; their copies of every
    # shared file, which `tests/shared-files-contract.test.mjs` compares byte
    # for byte with this repository's; the documentation site) and
    # `../cellucid-annotation` (the contract corpus this repository holds a
    # copy of), so those contracts run here, and a sibling that is missing is
    # a failure (`CELLUCID_REQUIRE_SIBLINGS`). Each list holds every file a
    # contract reads of that sibling: `tests/ci-sibling-checkouts-contract.test.mjs`
    # compares them with the list of shared files (`scripts/shared-files.mjs`)
    # and with what the other contracts read. Only `anndata-copy-cross-language`
    # reads more (a whole package, with a Python of its dependencies): it runs
    # in the `viewers` job, never here. The siblings are checked out at their
    # default branch when the job starts: a cross-repository change that lands
    # here before its sibling's change does fails these contracts until the
    # next run. The widget contract names each checkout's commit and runs the
    # behavior contracts on both copies, so its failure says which repository
    # is behind. A sibling's change goes first.
    defaults:
      run:
        working-directory: cellucid
    env:
      CELLUCID_REQUIRE_SIBLINGS: "1"

    steps:
      - name: Check out the exact source
        uses: actions/checkout@v7
        with:
          path: cellucid

      - name: Check out the published dataset session presets and their reader
        uses: actions/checkout@v7
        with:
          repository: theislab/cellucid-datasets
          path: cellucid-datasets
          filter: blob:none
          sparse-checkout: |
            anndata/datasets.json
            anndata/*.cellucid-session
            scripts/publish_session_preset.mjs
            scripts/anndata_store.mjs
          sparse-checkout-cone-mode: false

      - name: Check out the Python package's copies of the shared documents and golden history, and the documentation
        uses: actions/checkout@v7
        with:
          repository: theislab/cellucid-python
          path: cellucid-python
          filter: blob:none
          sparse-checkout: |
            docs/**/*.md
            docs/conf.py
            src/cellucid/action_catalog.json
            src/cellucid/history_model.schema.json
            src/cellucid/input_formats.json
            src/cellucid/jupyter/static/widget.js
            src/cellucid/mcp_tools.json
            tests/fixtures/category_default_colors.json
            tests/fixtures/data_mapping_conformance.json
            tests/fixtures/gene_sets.gmt
            tests/fixtures/history_golden/history_golden.cellucid-session
            tests/fixtures/history_golden/history_golden.expected.json
            tests/fixtures/history_golden/history_golden_state.cellucid-session
            tests/fixtures/latent_outlier_conformance.json
            tests/fixtures/obs_columns.csv
            tests/fixtures/older_anndata/legacy-0.6-compound-obsm.h5ad
            tests/fixtures/older_anndata/legacy-0.6-twin-current.h5ad
            tests/fixtures/older_anndata/legacy-0.6.h5ad
            tests/fixtures/older_anndata/legacy-0.7-csr.h5ad
            tests/fixtures/older_anndata/legacy-0.7-dense.h5ad
            tests/fixtures/older_anndata/legacy-0.7.zarr.zip
            tests/fixtures/older_anndata/legacy-h5sparse.h5ad
            tests/fixtures/older_anndata/legacy-seuratdisk.h5ad
            tests/fixtures/older_anndata/legacy-twin-current.h5ad
            tests/fixtures/subsample_conformance.json
            tests/fixtures/viewer_protocol.json
          sparse-checkout-cone-mode: false

      - name: Check out the R package's copies of the shared documents and golden history
        uses: actions/checkout@v7
        with:
          repository: theislab/cellucid-r
          path: cellucid-r
          filter: blob:none
          sparse-checkout: |
            inst/action_catalog.json
            inst/extdata/history_golden.cellucid-session
            inst/history_model.schema.json
            inst/input_formats.json
            inst/mcp_tools.json
            inst/widget/widget.js
            tests/testthat/fixtures/category_default_colors.json
            tests/testthat/fixtures/data_mapping_conformance.json
            tests/testthat/fixtures/gene_sets.gmt
            tests/testthat/fixtures/history_golden/history_golden.cellucid-session
            tests/testthat/fixtures/history_golden/history_golden.expected.json
            tests/testthat/fixtures/history_golden/history_golden_state.cellucid-session
            tests/testthat/fixtures/latent_outlier_conformance.json
            tests/testthat/fixtures/obs_columns.csv
            tests/testthat/fixtures/subsample_conformance.json
            tests/testthat/fixtures/viewer_protocol.json
          sparse-checkout-cone-mode: false

      - name: Check out the annotation repository's contract corpus
        uses: actions/checkout@v7
        with:
          repository: theislab/cellucid-annotation
          path: cellucid-annotation
          filter: blob:none
          sparse-checkout: |
            tests/fixtures/contract-corpus.json
          sparse-checkout-cone-mode: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Run every web contract
        run: npm test

      - name: Validate the deployable community-annotation Worker bundle
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run test:worker-bundle

      - name: Validate the deployable agent relay Worker bundle
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run test:relay-bundle

  browsers:
    name: ${{ matrix.os }} / ${{ matrix.browser }} / shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    # macOS Firefox runs the complete GPU-heavy shard correctly but needs well
    # over the former 30-minute ceiling on hosted runners. Per-test timeouts
    # still fence hangs; this job bound permits the full contract inventory.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Pushes and pull requests run every engine on Linux plus WebKit on
      # macOS; the nightly schedule and manual dispatch run every engine on
      # every operating system except WebKit on Windows. An `include` row that
      # matches an existing combination adds nothing, so the full matrix holds
      # no duplicates. WebKit on Windows is left out: Safari does not exist on
      # Windows, and Playwright's Windows WebKit build has no origin-private
      # file system and no OffscreenCanvas, which every Safari Cellucid
      # supports has, so it would fail whatever the code does. Safari is
      # covered by WebKit on macOS and Linux.
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        browser: [chromium, firefox, webkit]
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
        exclude:
          - os: windows-latest
            browser: webkit
        include:
          - os: macos-latest
            browser: webkit
            shard: "1/8"
          - os: macos-latest
            browser: webkit
            shard: "2/8"
          - os: macos-latest
            browser: webkit
            shard: "3/8"
          - os: macos-latest
            browser: webkit
            shard: "4/8"
          - os: macos-latest
            browser: webkit
            shard: "5/8"
          - os: macos-latest
            browser: webkit
            shard: "6/8"
          - os: macos-latest
            browser: webkit
            shard: "7/8"
          - os: macos-latest
            browser: webkit
            shard: "8/8"

    # The control walk runs in the `control-walk` job below, not in these
    # shards (`playwright.config.mjs`, `CELLUCID_CONTROL_WALK`).
    env:
      CELLUCID_CONTROL_WALK: apart

    # The steps the `control-walk` job runs too are anchored here (`&name`)
    # and repeated there by alias (`*name`), so the two jobs set up their
    # runners and keep their evidence the same way.
    steps:
      - &check-out
        name: Check out the exact source
        timeout-minutes: 5
        uses: actions/checkout@v7

      - &install-node
        name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - &install-dependencies
        name: Install exact dependencies
        timeout-minutes: 10
        run: npm ci

      # Windows: a browser context per test and hundreds of module requests
      # per page load park closed loopback sockets in TIME_WAIT for minutes
      # (the job-end evidence step counted 850 of them long after the batch),
      # and the default 16,384 ephemeral ports run out: the next connection
      # fails as `ERR_NO_BUFFER_SPACE` (Chromium) or "Could not connect to
      # server" (WebKit) in a spec that has nothing to do with the cause. Give
      # the host the whole unprivileged range.
      - &widen-windows-ports
        name: Widen the Windows ephemeral port range
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=1025 num=64510
          netsh int ipv6 set dynamicport tcp start=1025 num=64510
          netsh int ipv4 show dynamicport tcp

      # What the shard runs on is downloaded here, and each download has a
      # bound of its own: the Linux libraries come from the runner's apt
      # mirror, the engine from Playwright's CDN. apt cannot leave a mirror
      # connection that trickles (its timeout fires only on silence), and
      # about one runner in two dozen gets one: 30-50 kB/s from the package
      # pool while the same runner reads the index from the same mirror at
      # 13 MB/s, so a run of 48 Linux browser jobs can lose one to the step
      # bound. The script takes the download from apt: Playwright names the
      # missing packages, each is fetched under a speed floor and, when it
      # falls under it, again from the next mirror of the runner's own mirror
      # list, its hash checked, and apt installs from those files only
      # (`scripts/install-linux-engine-libraries.mjs`).
      - &install-linux-libraries
        name: Install the Linux libraries the selected engine needs
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: node scripts/install-linux-engine-libraries.mjs ${{ matrix.browser }}

      - &install-engine
        name: Install the selected browser engine
        timeout-minutes: 10
        run: npx playwright install ${{ matrix.browser }}

      # Once per engine and operating system: the WebGL2 contract, and the
      # log line naming the GL implementation the cell ran on (a hosted
      # runner's software rasterizer explains a timing failure that no spec
      # change would). Linux Firefox is verified through the display server
      # the shard below runs under.
      #
      # Hosted Linux runners draw on software GL (Chromium: SwiftShader;
      # Firefox: llvmpipe; WebKit masks its renderer as "Apple GPU" and drew
      # 262,144 points in 30 ms, like llvmpipe).
      # The page measures its device and acts on it (level of detail and
      # frustum culling from the GPU's time for a frame of every cell, a
      # progressive opening from what showing a cell cost, worker pools from
      # the cores): on these runners those measures differ from a developer
      # machine's. Every spec therefore runs on a fixed device, the `device`
      # fixture (`tests/browser/helpers/device.mjs`): a fast GPU timed
      # exactly, fixed cores, and every rate the reader plans from held (the
      # link it plans on, the decoding rate, the opening cost:
      # `assets/js/utils/machine.js`), on the page and in its workers; a spec
      # about one of those choices sets its own. See the web developer docs,
      # "Testing, CI and release process".
      - name: Record the WebGL2 runtime through the Linux display server
        if: matrix.browser == 'firefox' && runner.os == 'Linux' && matrix.shard == '1/8'
        run: >-
          xvfb-run --auto-servernum --
          npm run test:browser --
          --project=firefox
          --headed
          tests/browser/webgl2-runtime.spec.mjs

      - name: Record the WebGL2 runtime
        if: (matrix.browser != 'firefox' || runner.os != 'Linux') && matrix.shard == '1/8'
        run: >-
          npm run test:browser --
          --project=${{ matrix.browser }}
          tests/browser/webgl2-runtime.spec.mjs

      # A process per whole shard retained native GPU state long enough to
      # degrade hosted macOS Firefox. A process per file then exhausted Windows
      # networking resources late in the larger shards. Preserve Playwright's
      # exact assignment while bounding all dimensions. Ordinary native-GPU
      # lifetimes own at most six files and forty tests. Windows instead owns at
      # most two longer-lived processes of twenty-four files and ninety tests,
      # preventing browser/server churn from exhausting the host WinSock pool.
      # A browser-process boundary is not a host-GPU boundary, so vulnerable
      # runtimes run process-isolated stress after ordinary conformance and the
      # one workload proven to degrade the shared host GPU service in an
      # absolute-final singleton. Multiple host-terminal files are rejected so
      # future stress growth must use separate CI shards. Even those largest
      # shards are capped at nine real browsers. Eight shards keep every engine
      # on every runner at eight or fewer: Playwright splits by test order, and
      # the process-intensive files all fall into the first shard. Tests are neither retried nor
      # skipped, mocked, or given more time.
      - name: Run the selected headed Firefox shard in bounded processes
        if: matrix.browser == 'firefox' && runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum --
          npm run test:browser:bounded --
          --project=firefox
          --headed
          --shard=${{ matrix.shard }}

      - name: Run the selected browser shard in bounded processes
        if: matrix.browser != 'firefox' || runner.os != 'Linux'
        run: >-
          npm run test:browser:bounded --
          --project=${{ matrix.browser }}
          --shard=${{ matrix.shard }}

      # A browser process that crashes ("Page crashed", "Target crashed")
      # leaves no trace in Playwright's report. When the kernel killed it for
      # memory or a graphics driver faulted, the host's kernel log says so: a
      # red Linux job keeps the tail of it, with the memory picture, beside the
      # Playwright evidence.
      - &record-linux-host
        name: Record the host kernel log and memory
        if: failure() && runner.os == 'Linux'
        run: |
          mkdir -p test-results
          { free -m; echo; sudo dmesg --ctime | tail -n 400; echo; coredumpctl list 2>&1 | tail -n 20; } > test-results/host-kernel.log 2>&1
          # A browser process that dumped core (a WebKit web process whose main
          # thread hung, aborted when its page was closed) says where each of
          # its threads was: the stacks systemd-coredump recorded.
          sudo coredumpctl info --no-pager > test-results/host-coredumps.log 2>&1 || true

      # A Windows job that fails on a network error (`ERR_NO_BUFFER_SPACE`
      # loading a module from the loopback server) has run out of a host
      # resource, not of the server: keep the dynamic port range, the number
      # of sockets in each TCP state, and what holds the memory and handles.
      - &record-windows-host
        name: Record the host memory and sockets
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          & {
            Get-CimInstance Win32_OperatingSystem | Format-List FreePhysicalMemory, TotalVisibleMemorySize, FreeVirtualMemory, TotalVirtualMemorySize
            Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion
            netsh int ipv4 show dynamicport tcp
            netstat -ano -p tcp | Select-Object -Skip 4 | ForEach-Object { ($_ -split '\s+')[4] } | Group-Object | Sort-Object Count -Descending | Format-Table Name, Count
            Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 20 Name, Id, Handles, @{ Name = 'WorkingSetMB'; Expression = { [int]($_.WorkingSet64 / 1MB) } } | Format-Table
          } *> test-results/host-windows.log

      # A macOS job that fails on a timing contract keeps its memory, swap
      # and graphics device beside the Playwright evidence; one that failed on
      # a WebGL context handed lost (a test annotated `webgl-lost-at-creation`:
      # the browser's GPU process was reset, WebKit bug 328185) keeps what
      # says why: the accelerator's state, the GPU processes' log of the last
      # half hour, and any browser crash report. `system_profiler` prints no
      # display on a hosted runner, so it is not asked. The step's shell is
      # `bash -e`: a `grep` that matches nothing exits 1 and would end the
      # step there, before the GPU log and the crash reports are kept, so a
      # host that lists no such accelerator key records that and goes on.
      - &record-macos-host
        name: Record the host memory and graphics
        if: failure() && runner.os == 'macOS'
        run: |
          mkdir -p test-results/host-crash-reports
          { vm_stat; echo; sysctl vm.swapusage; echo; ioreg -r -c IOAccelerator -l -w0 | grep -E 'PerformanceStatistics|IOClass|model' || echo 'ioreg lists no IOAccelerator key'; echo; top -l 1 -o mem -n 15 | tail -n 22; } > test-results/host-macos.log 2>&1
          log show --last 30m --style compact --predicate 'process BEGINSWITH "com.apple.WebKit.GPU" OR process CONTAINS "MiniBrowser" OR eventMessage CONTAINS[c] "command buffer" OR eventMessage CONTAINS[c] "GPU reset"' > test-results/host-macos-gpu.log 2>&1 || true
          find ~/Library/Logs/DiagnosticReports -mmin -90 \( -iname '*WebKit*' -o -iname '*Playwright*' -o -iname '*firefox*' -o -iname '*Chrom*' \) -exec cp {} test-results/host-crash-reports/ \; 2>/dev/null || true

      # Playwright writes a screenshot and an error-context page snapshot for
      # every failed test under `test-results/<port>/`; a red job publishes
      # them so the failure can be read without re-running it. The job's id
      # keeps the names of both jobs' artifacts apart (an artifact name is
      # unique in a run).
      - &upload-failure-evidence
        name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.job }}-${{ strategy.job-index }}-${{ matrix.os }}-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The control walk (`tests/browser/helpers/control-walk.mjs`): a test per
  # part of the page, each minutes long, declared by the files
  # `tests/browser/control-walk-<k>-of-<n>.spec.mjs`, a share each (filled by
  # weight, `tests/browser/helpers/control-walk-parts.mjs`), and Chromium
  # only. Playwright shards by test count, so in the browser job its few long
  # tests would fall into one shard together and that shard would run several
  # times as long as the others. Here each share is a job of its own
  # (`CELLUCID_CONTROL_WALK=only`, one shard a file), on the operating
  # systems the browser job runs Chromium on, through the same bounded
  # runner and with the same setup and evidence steps.
  control-walk:
    name: ${{ matrix.os }} / ${{ matrix.browser }} / control walk ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        browser: [chromium]
        shard: ["1/4", "2/4", "3/4", "4/4"]

    env:
      CELLUCID_CONTROL_WALK: only

    steps:
      - *check-out
      - *install-node
      - *install-dependencies
      - *widen-windows-ports
      - *install-linux-libraries
      - *install-engine

      - name: Run the selected control-walk share in bounded processes
        run: >-
          npm run test:browser:bounded --
          --project=${{ matrix.browser }}
          --shard=${{ matrix.shard }}

      - *record-linux-host
      - *record-windows-host
      - *record-macos-host
      - *upload-failure-evidence

  # The specs that run the viewer against the real Python and R packages
  # (`viewer-channel`, `viewer-history`, `viewer-round-trip`, `mcp-local`,
  # `notebook-widget-jupyterlab` with `CELLUCID_PYTHON`; `r-viewer-channel`,
  # `r-viewer-history` with `CELLUCID_RSCRIPT`) skip on a machine that names no
  # interpreter, so the browser shards above never run them. This job installs
  # both packages from their checkouts and names the interpreters;
  # `CELLUCID_REQUIRE_VIEWERS=1` makes an interpreter that is missing a
  # failure, not a skip. Chromium on Linux: the Python and R sides, not the
  # engines, are what these specs add. The contract test of the web app's
  # copies read by Python (`anndata-copy-cross-language`) needs the same Python
  # and runs here too. The siblings are checked out inside the workspace of
  # this repository, and named by their roots.
  viewers:
    name: ${{ matrix.os }} / ${{ matrix.browser }} / viewer against the Python and R packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        browser: [chromium]

    env:
      CELLUCID_REQUIRE_VIEWERS: "1"
      CELLUCID_PYTHON_ROOT: ${{ github.workspace }}/siblings/cellucid-python
      CELLUCID_R_ROOT: ${{ github.workspace }}/siblings/cellucid-r

    steps:
      - *check-out
      - *install-node
      - *install-dependencies
      - *install-linux-libraries
      - *install-engine

      # What `pip install -e` builds from, the sources the specs run
      # (`PYTHONPATH` names `src`) and the golden history `viewer-channel` loads:
      # the package's own files, not its documentation.
      - name: Check out cellucid-python
        timeout-minutes: 5
        uses: actions/checkout@v7
        with:
          repository: theislab/cellucid-python
          path: siblings/cellucid-python
          filter: blob:none
          sparse-checkout: |
            /pyproject.toml
            /README.md
            /LICENSE
            /MANIFEST.in
            /src/
            /tests/fixtures/history_golden/history_golden.cellucid-session
          sparse-checkout-cone-mode: false

      - name: Check out cellucid-r
        timeout-minutes: 5
        uses: actions/checkout@v7
        with:
          repository: theislab/cellucid-r
          path: siblings/cellucid-r

      - name: Install Python
        timeout-minutes: 5
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The package with the extras the specs need (the MCP server, MuData),
      # and JupyterLab with its kernel for the notebook widget spec.
      - name: Install cellucid-python and JupyterLab
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${CELLUCID_PYTHON_ROOT}[mcp,mudata]" "jupyterlab>=4,<5" ipykernel

      - name: Install R
        timeout-minutes: 10
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # cellucid-r's hard dependencies, and SingleCellExperiment (Bioconductor),
      # which the specs' R objects are; IRkernel (with IRdisplay) is the R
      # kernel of the notebook widget spec, which registers it for its own
      # JupyterLab, and pkgload loads the checkout in that kernel.
      - name: Install cellucid-r's dependencies
        timeout-minutes: 20
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: siblings/cellucid-r
          dependencies: '"hard"'
          extra-packages: any::SingleCellExperiment any::IRkernel any::pkgload

      # The specs `library(cellucid)`: the package as installed, built from
      # the checkout.
      - name: Install cellucid-r from its checkout
        timeout-minutes: 10
        run: R CMD INSTALL "${CELLUCID_R_ROOT}"

      - name: Name the Python and R the specs run
        run: |
          echo "CELLUCID_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "CELLUCID_RSCRIPT=$(which Rscript)" >> "$GITHUB_ENV"
          echo "CELLUCID_R=$(which R)" >> "$GITHUB_ENV"

      - name: Run the viewer specs against the real packages
        timeout-minutes: 30
        run: >-
          npm run test:browser --
          --project=${{ matrix.browser }}
          tests/browser/viewer-channel.spec.mjs
          tests/browser/viewer-history.spec.mjs
          tests/browser/viewer-round-trip.spec.mjs
          tests/browser/mcp-local.spec.mjs
          tests/browser/notebook-widget-jupyterlab.spec.mjs
          tests/browser/r-viewer-channel.spec.mjs
          tests/browser/r-viewer-history.spec.mjs

      - name: Run the contract test of Python reading the web app's copies
        timeout-minutes: 10
        run: node --test tests/anndata-copy-cross-language.test.mjs

