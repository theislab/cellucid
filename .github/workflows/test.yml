name: Web contracts

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24", "26"]

    steps:
      - name: Check out the exact source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Run every web contract
        run: npm test

      - name: Validate the deployable community-annotation Worker bundle
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run test:worker-bundle

  browsers:
    name: ${{ matrix.os }} / ${{ matrix.browser }} / shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    # macOS Firefox runs the complete GPU-heavy shard correctly but needs well
    # over the former 30-minute ceiling on hosted runners. Per-test timeouts
    # still fence hangs; this job bound permits the full contract inventory.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chromium, firefox, webkit]
        shard: ["1/2", "2/2"]

    steps:
      - name: Check out the exact source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Install the selected browser engine and Linux libraries
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install the selected browser engine
        if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.browser }}

      - name: Verify Firefox WebGL2 through the Linux display server
        if: matrix.browser == 'firefox' && runner.os == 'Linux' && matrix.shard == '1/2'
        run: >-
          xvfb-run --auto-servernum --
          npm run test:browser --
          --project=firefox
          --headed
          tests/browser/webgl2-runtime.spec.mjs

      - name: Verify Firefox WebGL2 on macOS and Windows
        if: matrix.browser == 'firefox' && runner.os != 'Linux' && matrix.shard == '1/2'
        run: >-
          npm run test:browser --
          --project=firefox
          tests/browser/webgl2-runtime.spec.mjs

      # A process per whole shard retained native GPU state long enough to
      # degrade hosted macOS Firefox. A process per file then exhausted Windows
      # networking resources late in the larger shards. Preserve Playwright's
      # exact assignment while bounding all dimensions: each ordinary child
      # owns at most six files and forty tests. On vulnerable runtimes, declared
      # native-GPU stress files run as singleton processes after every ordinary
      # batch: the hosted GPU service can retain degraded state after Firefox
      # exits, so a process boundary alone cannot protect the next page. Even
      # those largest shards are capped at nine real browsers. Tests are neither
      # retried nor skipped, mocked, or given more time.
      - name: Run the selected headed Firefox shard in bounded processes
        if: matrix.browser == 'firefox' && runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum --
          npm run test:browser:bounded --
          --project=firefox
          --headed
          --shard=${{ matrix.shard }}

      - name: Run the selected browser shard in bounded processes
        if: matrix.browser != 'firefox' || runner.os != 'Linux'
        run: >-
          npm run test:browser:bounded --
          --project=${{ matrix.browser }}
          --shard=${{ matrix.shard }}
