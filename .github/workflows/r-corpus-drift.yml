name: R object drift

# Once a month, the R object corpus is written again with the current CRAN
# SeuratObject and Matrix and the current Bioconductor SingleCellExperiment,
# and read with the transcoders (scripts/rds-corpus/drift.sh): a package
# release that changes how an object is stored, or adds or removes a slot,
# fails here before a user's file does. It also runs when the R readers or the
# corpus scripts change. Locally: sh scripts/rds-corpus/drift.sh <Rscript>.
on:
  schedule:
    - cron: "41 5 1 * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/rds-corpus/**"
      - "assets/js/formats/rds/**"
      - "assets/js/data/anndata/transcode/**"
      - ".github/workflows/r-corpus-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Current CRAN and Bioconductor objects
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install the current SeuratObject, Matrix and SingleCellExperiment
        run: |
          Rscript -e 'install.packages(c("Matrix", "jsonlite", "SeuratObject", "BiocManager"))'
          Rscript -e 'BiocManager::install("SingleCellExperiment", update = FALSE, ask = FALSE)'
          Rscript -e 'for (p in c("Matrix", "SeuratObject", "SingleCellExperiment")) cat(p, format(packageVersion(p)), "\n")'

      - name: Write the corpus again and read it
        run: sh scripts/rds-corpus/drift.sh Rscript "$RUNNER_TEMP/drift"
